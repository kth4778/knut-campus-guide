name: GitHub Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # 저장소 Secret 'BUS_API_KEY'가 있으면 배포본에만 config.js를 만들어 넣어요 (git에는 안 올라감)
      - name: 버스 API 키 넣기
        env:
          BUS_API_KEY: ${{ secrets.BUS_API_KEY }}
        run: |
          if [ -n "$BUS_API_KEY" ]; then
            printf "window.KNUT_CONFIG = { BUS_API_KEY: '%s' };\n" "$BUS_API_KEY" > dist/config.js
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
