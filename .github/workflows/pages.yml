name: GitHub Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 1) E2E 테스트 (docs/E2E_TEST_PLAN.md). 하나라도 실패하면 아래 배포를 하지 않는다
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: E2E 테스트 (컴퓨터 폰 틀 + 휴대폰)
        run: npx playwright test --project=desktop --project=mobile
      - name: 실패하면 결과 보고서 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # 2) 테스트를 통과했을 때만 GitHub Pages 에 배포
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # 저장소 Secret 'BUS_API_KEY'가 있으면 배포본에만 config.js를 만들어 넣어요 (git에는 안 올라감)
      - name: 버스 API 키 넣기
        env:
          BUS_API_KEY: ${{ secrets.BUS_API_KEY }}
        run: |
          if [ -n "$BUS_API_KEY" ]; then
            printf "window.KNUT_CONFIG = { BUS_API_KEY: '%s' };\n" "$BUS_API_KEY" > dist/config.js
          fi
      # GitHub Pages는 파일을 10분 동안 캐시해서 새로고침해도 옛 화면이 보여요.
      # 배포할 때마다 우리 js·css·json 주소 뒤에 ?v=커밋 을 붙여 새 파일을 받게 해요 (배포본만, git 원본은 그대로)
      - name: 캐시 무효화용 버전 붙이기
        run: |
          V="${GITHUB_SHA::7}"
          sed -i -E "s#((href|src)=\")([A-Za-z0-9_-]+\.(js|css))\"#\1\3?v=$V\"#g" dist/index.html
          sed -i -E "s#(from[[:space:]]+['\"]\./[A-Za-z0-9_-]+\.js)(['\"])#\1?v=$V\2#g; s#(fetch\(['\"]\./data/[A-Za-z0-9_-]+\.json)(['\"])#\1?v=$V\2#g" dist/*.js
          grep -c "?v=$V" dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

  # 3) 배포된 공개 사이트 확인 (버전 붙음·버스 키·네이버 지도·진짜 버스 API)
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: 배포 확인
        run: npx playwright test --project=deploy
